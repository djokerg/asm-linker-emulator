name: build-and-test

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build toolchain image
        run: docker build -t system-software-toolchain .

      - name: Build assembler, linker, emulator and run all examples
        run: docker run --rm -v "$PWD":/ss system-software-toolchain scripts/run-tests.sh

      - name: Upload logs and intermediate files
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-output
          path: build/
